; Harbour Key's phone line: calls from the SIP trunk (pjsip.conf on the VPS,
; endpoint "trunk") go to the voice agent, or to the office.
; This is a template: npm run deploy fills in the secret and office number from .env (voice/dialplan.mjs)
; and installs it as /etc/asterisk/extensions.conf. Edit it here, not on the server.
; Needs app_audiosocket and func_curl (both in Debian's asterisk package).

[globals]
; The voice service (the "voice" container), published on this host's 127.0.0.1.
AGENT_VOICE_URL=http://127.0.0.1:8081/voice/asterisk
AGENT_VOICE_AUDIOSOCKET=127.0.0.1:9093
AGENT_VOICE_SECRET=@@AGENT_ASTERISK_SECRET@@
; AGENT_OFFICE_NUMBER, as the trunk dials it.
AGENT_OFFICE=@@AGENT_OFFICE@@

[from-trunk]
exten => _[+0-9].,1,NoOp(Inbound call: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=8)
 ; A one-time UUID: the agent takes the call. Anything else ("office", or no answer): the office does.
 same => n,Set(AGENT_CALL=${CURL(${AGENT_VOICE_URL}/calls,secret=${AGENT_VOICE_SECRET}&from=${URIENCODE(${CALLERID(num)})}&channel=${URIENCODE(${UNIQUEID})})})
 same => n,GotoIf($[${LEN(${AGENT_CALL})} != 36]?office)
 same => n,Answer()
 same => n,AudioSocket(${AGENT_CALL},${AGENT_VOICE_AUDIOSOCKET})
 ; The agent hung up ("done"), or it never got going and the office takes the call.
 ; (When the caller hangs up, the dialplan stops before this.)
 same => n,Set(AGENT_AFTER=${CURL(${AGENT_VOICE_URL}/after,secret=${AGENT_VOICE_SECRET}&call=${AGENT_CALL})})
 same => n,GotoIf($["${AGENT_AFTER}" = "done"]?end)
 same => n(office),Dial(PJSIP/${AGENT_OFFICE}@trunk,40)
 same => n(end),Hangup()
